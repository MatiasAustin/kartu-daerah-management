<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>MapLibre Test</title>
  <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
  <script src="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.js"></script>
  <link href="https://unpkg.com/maplibre-gl@3.6.2/dist/maplibre-gl.css" rel="stylesheet">
  <style>
    body { margin: 0; padding: 0; }
    #map { position: absolute; top: 0; bottom: 0; width: 100%; }
  </style>
</head>
<body>
<div id="map"></div>
<script>
  const map = new maplibregl.Map({
    container: 'map',
    style: {
      version: 8,
      sources: {
        carto: {
          type: "raster",
          tiles: ["https://a.basemaps.cartocdn.com/light_all/{z}/{x}/{y}.png"],
          tileSize: 256
        }
      },
      layers: [{ id: "carto", type: "raster", source: "carto" }]
    },
    center: [107.432963301, -6.3893235],
    zoom: 15
  });

  map.on('load', () => {
    map.addSource('areas', {
      type: 'geojson',
      data: {
        type: 'FeatureCollection',
        features: [{
          type: 'Feature',
          id: 'test-id',
          geometry: {
            type: 'Polygon',
            coordinates: [[[107.43296330111491, -6.3893235], [107.432963301, -6.389067663], [107.439486433, -6.391200099], [107.43296330111491, -6.3893235]]]
          },
          properties: {
            color: '#ef4444'
          }
        }]
      }
    });

    map.addLayer({
      id: 'areas-fill',
      type: 'fill',
      source: 'areas',
      paint: {
        'fill-color': ['get', 'color'],
        'fill-opacity': 0.5
      }
    });
  });
</script>
</body>
</html>
